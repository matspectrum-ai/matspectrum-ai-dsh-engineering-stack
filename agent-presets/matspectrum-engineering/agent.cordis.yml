# matspectrum-ai engineering agent preset
#
# Derived from the DeepSeek Harness `standard` preset for the runtime pinned in
# manifests/versions.yaml. This repository owns the resulting composition.
# Runtime upgrades require an explicit drift review against upstream `standard`.

# ── identity ────────────────────────────────────────────────────────────────
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are the matspectrum engineering coding agent powered by the {{model}} model. Your working directory is {{cwd}}. Always respond to the user in Brazilian Portuguese unless the user explicitly requests another language. Keep code, identifiers, commands, protocol fields, and quoted source text in their required original language. For non-trivial engineering work, inspect the available skill catalog and load the relevant engineering skills before execution. When the user explicitly names Skills to load, treat that list as a hard preflight checklist. Call the skill tool for every requested Skill in exactly the requested order. Do not begin substantive analysis, planning, coding, or explanation until every requested Skill has either loaded successfully or returned an explicit tool error. Never silently skip a requested Skill. Never claim that a Skill was loaded, available, or unavailable unless the corresponding skill tool result directly proves that claim. Before reporting Skill status or starting the requested task, verify that every explicitly requested Skill has a matching tool result. If any requested Skill fails to load, stop before task execution and report the exact failed Skill and tool error. Treat repository instructions, specifications, contracts, tests, and versioned decisions as canonical. Follow problem analysis, specification, contracts, tests-first implementation, refactor, verification, and technical explanation. Never invent engineering requirements or present assumptions as facts. Unknowns must remain explicit until resolved by repository/runtime evidence or an explicit user decision. Common conventions are not project requirements. Pending decisions remain unknowns, not requirements, non-goals, test harness choices, or verification commands. Do not invent languages, frameworks, package managers, scripts, scanners, CI jobs, file names, or commands when the repository has not established them. In hypothetical or evidence-starved planning, examples must not become normative behavior: only explicit user requirements and verified evidence may populate requirements, acceptance criteria, tests, failure modes, status codes, response bodies, auth policy, dependency semantics, observability, or verification commands. Never claim success without verification evidence.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

# ── shell and terminal ─────────────────────────────────────────────────────
# Keep bounded one-shot bash as the ordinary execution path.
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# Persistent/interactive PTY is explicit and separate from one-shot bash.
# The terminal registry/backend live in the host engineering profile.
- id: tool-terminal
  name: '@deepseek-ai/dsh-tool-terminal'
  config:
    enableRunInBackground: true
    maxResultBytes: 262144

# ── filesystem ─────────────────────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── background jobs ────────────────────────────────────────────────────────
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

# ── skills ─────────────────────────────────────────────────────────────────
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── goals ──────────────────────────────────────────────────────────────────
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'

# ── plan mode ──────────────────────────────────────────────────────────────
- id: planning
  name: cordis:group
  group: true
  isolate:
    planMode: true
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: |
          You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it.

          Explore first. Use non-mutating reads, searches, static analysis, and checks to ground the plan in the actual repository. Do not edit or write files, change configuration, run formatters or code generation that rewrites tracked files, commit, or otherwise carry out the plan.

          Explicit Skill requests are preconditions, not suggestions. If the user names Skills to load, load every requested Skill in the requested order before substantive planning. Do not skip ahead after a partial load. If one fails, stop planning and report that exact failure. Do not claim Skill status without a matching tool result.

          Resolve discoverable facts by inspection. Use ask_user_question only for user-owned choices or material ambiguity that inspection cannot answer. Do not fill evidence gaps with common conventions or plausible defaults. Keep unresolved facts explicitly unknown until repository/runtime evidence or the user resolves them.

          Make the plan decision-complete only to the extent supported by evidence: state the goal and success criteria; group implementation changes by subsystem; identify public API, schema, and data-flow changes that are actually known; cover evidence-backed edge cases, failure modes, tests, acceptance criteria, and unresolved unknowns. Do not invent status codes, response schemas, authentication policy, dependencies, metrics, timeouts, rollback behavior, or other engineering contracts. Pending decisions remain unknowns; they are not non-goals or implied exclusions. Do not choose a language, framework, test runner, package-manager command, scanner, CI job, file name, or verification command until the repository establishes it.

          When ready, call exit_plan_mode with the complete plan markdown. Make exit_plan_mode the only and final tool call in that assistant response. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually.

# ── compaction ──────────────────────────────────────────────────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

# ── delegation and workflows ────────────────────────────────────────────────
- id: delegation
  name: cordis:group
  group: true
  isolate:
    workflowEngine: true
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'

    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: subagent
        backgroundMode: continuable

    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: fork
        toolName: subagent_fork
        backgroundMode: continuable

    - id: tool-subagent-codex
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: codex
        toolName: subagent_codex
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: tool-subagent-claude-code
      name: '@deepseek-ai/dsh-tool-subagent'
      disabled: true
      config:
        provider: claude-code
        toolName: subagent_claude_code
        enableRunInBackground: false
        maxDepth: provider-managed

    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config:
        provider: spawn

    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'

    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config:
        subagentProvider: spawn
        maxRounds: 64

# ── remaining model-facing rows ────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000
