name: Engineering Skills

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  skills-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          sh -n tests/acceptance/skills_contract.sh
          sh -n scripts/bootstrap
          sh -n scripts/doctor

      - name: Run Phase 3 acceptance contract
        run: sh tests/acceptance/skills_contract.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          test "$(pnpm --version)" = "11.7.0"

      - name: Install canonical runtime graph
        run: pnpm install --frozen-lockfile

      - name: Bootstrap isolated skills runtime
        run: |
          DSH_HOME="$RUNNER_TEMP/dsh-home" \
          DSH_AGENTS_HOME="$RUNNER_TEMP/agents-home" \
          DSH_ENGINEERING_BIN_DIR="$RUNNER_TEMP/bin" \
          ./scripts/bootstrap

      - name: Verify isolated doctor
        run: |
          DSH_HOME="$RUNNER_TEMP/dsh-home" \
          DSH_AGENTS_HOME="$RUNNER_TEMP/agents-home" \
          DSH_ENGINEERING_BIN_DIR="$RUNNER_TEMP/bin" \
          ./scripts/doctor
