name: Foundation Contract

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate shell syntax
        run: |
          sh -n tests/acceptance/stack_contract.sh
          sh -n scripts/bootstrap
          sh -n scripts/doctor
          sh -n bin/dsh-engineering

      - name: Validate executable contracts
        run: |
          test "$(git ls-files -s scripts/bootstrap | awk '{print $1}')" = "100755"
          test "$(git ls-files -s scripts/doctor | awk '{print $1}')" = "100755"
          test "$(git ls-files -s bin/dsh-engineering | awk '{print $1}')" = "100755"

      - name: Run foundation acceptance contract
        run: sh tests/acceptance/stack_contract.sh

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.7.0 --activate
          test "$(pnpm --version)" = "11.7.0"

      - name: Verify pinned DSH is published
        run: |
          expected=$(node -p "require('./package.json').dependencies['@deepseek-ai/dsh']")
          actual=$(pnpm view "@deepseek-ai/dsh@$expected" version)
          test "$actual" = "$expected"

      - name: Install pinned runtime
        run: pnpm install --no-frozen-lockfile

      - name: Verify installed DSH version
        run: |
          expected=$(node -p "require('./package.json').dependencies['@deepseek-ai/dsh']")
          ./node_modules/.bin/dsh --version | grep -F "$expected"
